name: tests

# 这个仓库一共 10 层测试网，其中 7 层要连 headless Edge 做真实渲染/事件，
# Actions 里起不了浏览器 —— 所以 CI 只跑**不依赖浏览器的三层**：
#   1  logic.test.cjs   纯函数逻辑
#   2  agent.test.mjs   agent 回路 + 工具只读硬保证
#   10 no_secret.test.cjs 推送防泄漏（待该文件进仓库后自动接上）
# 剩下的层怎么在本机跑，见 README 的「自测」一节。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 第 1 层 — 纯函数逻辑
        run: node test/logic.test.cjs

      - name: 第 2 层 — agent 回路 + 全程只读
        run: node test/agent.test.mjs

      - name: 第 10 层 — 推送防泄漏自检
        # 这一层是本地的第 10 层；它还没进仓库时跳过并留一条 notice，
        # 进仓库之后这里会自动跑起来，不用再改 workflow。
        run: |
          if [ -f test/no_secret.test.cjs ]; then
            node test/no_secret.test.cjs
          else
            echo "::notice::test/no_secret.test.cjs 还没进仓库，本层跳过"
          fi
